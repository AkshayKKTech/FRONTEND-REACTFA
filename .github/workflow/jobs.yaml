name: reactjs build,test and deploy docker image

on:
  push:
    branches:
      - main

jobs:
  build and test:
    runs-on: self-hosted
    steps: 
      - name: checkout
        uses: actions/checkout@v3
      - name: test
        run: CI=true npm test
      - name: build
        run: |
          npm run build
          echo "Completed successfully"
  
