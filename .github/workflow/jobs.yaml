name: checkout-test-build

on:
  push:
    branches:
      - main

jobs:
  build and test:
    runs-on: self-hosted
    steps: 
      - name: checkout
        uses: actions/checkout@v3
      - name: setup node js
        uses: actions/node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies and test
        run: |
          npm ci
          CI=true npm test
          
  
