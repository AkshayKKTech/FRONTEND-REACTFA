name: Sonar-test

on:
  workflow_dispatch:

jobs:
  sonarqube:
  runs-on: ubuntu-latest
  steps:
    - name: checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: login sonar
      uses: SonarSource/sonarqube-scan-action@v5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with: args: >
          -Dsonar.qualitygate.wait=true

  
  
