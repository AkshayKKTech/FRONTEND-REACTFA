name: checkout-test-build

on:
  push:
    branches:
      - main
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: repo1

jobs:
  build_and_test:
    runs-on: self-hosted
    steps: 
      - name: checkout
        uses: actions/checkout@v3
      - name: setup node js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          

      - name: Install dependencies and test
        run: |
          npm install
          CI=true npm test
          
  
  docker_login_and_push:
    runs-on: self-hosted
    steps:
      - name: checkout scm
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentails@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-screte-key-id: ${{ secrets.AWS_SCRETE_KEY }}
          region: ${{ env.AWS_REGION }}

      - name: Log in to ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to ecr
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          run: |
            docker build \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:v1 .
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:v1
        
        



          
